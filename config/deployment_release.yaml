release_version: "v1.6.9"
openclaw_compatibility: "2026.3.2"
openai_policy:
  type: "fixed"
  allowed_model: "openai-codex/gpt-5.3-codex"
runtime_topology:
  entry_agent: "main_mixed_router"
  architecture_agent: "luban"
  execution_agent: "pangu_queue_scheduler"
  acceptance_agent: "braintrust_compliance"
  knowledge_persona_owner: "wenquxing"
  knowledge_governance_owner: "knowledge_manager"
  learning_interface_agent: "scholar"
  notification_agent: "feige_notifier"
  scheduler_model: "scheduler-* independent dispatch"
permission_policy:
  global_tools_profile: "messaging"
  main_tools_profile: "full"
  pangu_tools_profile: "full"
  approval_mode: "ask"
  minimal_allowlist:
    - "/opt/homebrew/bin/openclaw"
    - "/usr/bin/git"
    - "/usr/bin/python3"
    - "/usr/bin/pip3"
    - "/opt/homebrew/bin/clawhub"
main_enhancement_policy:
  pangu_direct_write: "enabled_with_whitelist_and_audit"
  whitelist_paths:
    - "~/.openclaw/workspace/memory/**"
    - "~/.openclaw/workspace/skills/**"
    - "~/.openclaw/workspace/AGENTS.md#routing-rules"
  forbidden_paths:
    - "~/.openclaw/openclaw.json"
    - "~/.openclaw/exec-approvals.json"
memory_model:
  topology: "layered"
  main_shared:
    - "~/.openclaw/workspace/memory/ROUTING_MEMORY.md"
    - "~/.openclaw/workspace/memory/ROUTING_DECISIONS.jsonl"
    - "~/.openclaw/workspace/memory/PROMOTION_LOG.jsonl"
  pangu_private:
    - "~/.openclaw/workspaces/pangu/memory/EXECUTION_LEARNINGS.md"
    - "~/.openclaw/workspaces/pangu/memory/MAIN_PATCH_LOG.jsonl"
required_artifacts:
  team_design_outputs:
    - "team_blueprint.md"
    - "team_agent_contract.json"
    - "team_model_assignment.json"
  quality_contract_outputs:
    - "quality_gate_report.json"
    - "quality_improvement_log.jsonl"
    - "quality_baseline.yaml"
  learning_contract_outputs:
    - "learning_topic_plan-YYYYMMDD-HHMMSS.md"
    - "source_candidates-YYYYMMDD-HHMMSS.json"
    - "source_evaluation-YYYYMMDD-HHMMSS.json"
    - "knowledge_digest-YYYYMMDD-HHMMSS.md"
    - "qmd_sync_report-YYYYMMDD-HHMMSS.json"
    - "notification_receipt-YYYYMMDD-HHMMSS.json"
  team_contract_constraints:
    - "interface_agent_id must be unique team external entry"
    - "internal agents cannot reply to end user directly"
    - "team model assignment must include selection_rationale per agent"
  quality_contract_constraints:
    - "any failed quality gate must force final_quality_status=blocked"
    - "quality improvement loop must include measurable metric changes"
  learning_contract_constraints:
    - "scholar must be the single external learning interface agent"
    - "knowledge_manager is governance-only and must not rewrite primary persona"
    - "feige_notifier must persist notification receipts with retry/final status"
    - "project_score >= 70 required for candidate knowledge entries"
required_scripts:
  - "scripts/validate_brain_trust_env.sh"
  - "scripts/bootstrap_luban_role.sh"
  - "scripts/validate_team_contract.sh"
  - "scripts/sync_brain_trust_models.sh"
  - "scripts/export_available_models.sh"
  - "scripts/run_brain_trust_review.sh"
  - "scripts/test_run_brain_trust_review_regression.sh"
  - "scripts/bootstrap_brain_trust.sh"
  - "scripts/bootstrap_agent_memory_layers.sh"
  - "scripts/route_learning_compact.sh"
  - "scripts/promote_skill_from_pangu_to_main.sh"
  - "scripts/verify_main_delegate_reliability.sh"
  - "scripts/pangu_task_scheduler.sh"
  - "scripts/ensure_scheduler_capacity.sh"
  - "scripts/verify_public_release.sh"
  - "scripts/build_release_branch.sh"
  - "scripts/check_release_docs_consistency.sh"
  - "scripts/validate_docs_path_policy.sh"
  - "scripts/register_artifact_index.sh"
  - "scripts/task_ledger.sh"
  - "scripts/check_interface_bindings.sh"
  - "scripts/runtime_health_audit.sh"
  - "scripts/sync_runtime_backlog_tasks.sh"
  - "scripts/audit_task_ledger_sla.sh"
  - "scripts/bootstrap_agent_sessions.sh"
  - "scripts/quality_evolution_compact.sh"
  - "scripts/install_runtime_audit_cron.sh"
  - "scripts/phase2_runtime_convergence.sh"
  - "scripts/run_mvp_team_closure.sh"
  - "scripts/tests/test_task_ledger.sh"
  - "scripts/tests/test_acceptance_gate.sh"
  - "scripts/tests/test_runtime_health_audit.sh"
  - "scripts/tests/test_sync_runtime_backlog_tasks.sh"
  - "scripts/tests/test_audit_task_ledger_sla.sh"
  - "scripts/tests/test_bootstrap_agent_sessions.sh"
  - "scripts/tests/test_quality_evolution_compact.sh"
  - "scripts/tests/test_route_learning_compact.sh"
  - "scripts/tests/test_mvp_team_closure.sh"
acceptance_checks:
  - "bash -n scripts/run_brain_trust_review.sh"
  - "bash -n scripts/validate_brain_trust_env.sh"
  - "bash -n scripts/bootstrap_luban_role.sh"
  - "bash -n scripts/validate_team_contract.sh"
  - "bash -n scripts/sync_brain_trust_models.sh"
  - "bash -n scripts/test_run_brain_trust_review_regression.sh"
  - "bash -n scripts/bootstrap_brain_trust.sh"
  - "bash -n scripts/bootstrap_agent_memory_layers.sh"
  - "bash -n scripts/route_learning_compact.sh"
  - "bash -n scripts/promote_skill_from_pangu_to_main.sh"
  - "bash -n scripts/verify_main_delegate_reliability.sh"
  - "bash -n scripts/pangu_task_scheduler.sh"
  - "bash -n scripts/ensure_scheduler_capacity.sh"
  - "bash -n scripts/verify_public_release.sh"
  - "bash -n scripts/build_release_branch.sh"
  - "bash -n scripts/check_release_docs_consistency.sh"
  - "bash -n scripts/validate_docs_path_policy.sh"
  - "bash -n scripts/register_artifact_index.sh"
  - "bash -n scripts/task_ledger.sh"
  - "bash -n scripts/check_interface_bindings.sh"
  - "bash -n scripts/runtime_health_audit.sh"
  - "bash -n scripts/sync_runtime_backlog_tasks.sh"
  - "bash -n scripts/audit_task_ledger_sla.sh"
  - "bash -n scripts/bootstrap_agent_sessions.sh"
  - "bash -n scripts/quality_evolution_compact.sh"
  - "bash -n scripts/install_runtime_audit_cron.sh"
  - "bash -n scripts/phase2_runtime_convergence.sh"
  - "bash -n scripts/run_mvp_team_closure.sh"
  - "bash -n scripts/tests/test_task_ledger.sh"
  - "bash -n scripts/tests/test_acceptance_gate.sh"
  - "bash -n scripts/tests/test_runtime_health_audit.sh"
  - "bash -n scripts/tests/test_sync_runtime_backlog_tasks.sh"
  - "bash -n scripts/tests/test_audit_task_ledger_sla.sh"
  - "bash -n scripts/tests/test_bootstrap_agent_sessions.sh"
  - "bash -n scripts/tests/test_quality_evolution_compact.sh"
  - "bash -n scripts/tests/test_route_learning_compact.sh"
  - "bash -n scripts/tests/test_mvp_team_closure.sh"
  - "scripts/verify_main_delegate_reliability.sh"
  - "scripts/build_release_branch.sh --version v1.6.9 --dry-run --allow-dirty"
  - "scripts/check_release_docs_consistency.sh"
  - "scripts/validate_docs_path_policy.sh --docs-root /Volumes/TB512/3_ClawDocs --out /Volumes/TB512/3_ClawDocs/team-brain-trust/review/202603"
  - "scripts/register_artifact_index.sh --docs-root /Volumes/TB512/3_ClawDocs --team team-brain-trust --artifact evidence --topic sample --path /Volumes/TB512/3_ClawDocs/team-brain-trust/review/202603/summary_report.md --producer-script run_brain_trust_review.sh --status generated"
  - "scripts/pangu_task_scheduler.sh stats --queue-file /tmp/bt_queue.jsonl --state-file /tmp/bt_queue_state.json"
  - "scripts/ensure_scheduler_capacity.sh --queue-depth 1 --threshold 6 --registry-file /tmp/bt_scheduler_registry.json --events-file /tmp/bt_scheduler_events.jsonl"
  - "source config/brain_trust.env.example && scripts/validate_brain_trust_env.sh"
  - "openclaw agents list --json | jq -r 'map(.id) | join(\" \")' | rg -n \"scholar|feige_notifier\""
  - "scripts/validate_team_contract.sh --dir roles/luban/templates"
  - "scripts/test_run_brain_trust_review_regression.sh"
  - "scripts/tests/test_task_ledger.sh"
  - "scripts/tests/test_acceptance_gate.sh"
  - "scripts/tests/test_runtime_health_audit.sh"
  - "scripts/tests/test_sync_runtime_backlog_tasks.sh"
  - "scripts/tests/test_audit_task_ledger_sla.sh"
  - "scripts/tests/test_bootstrap_agent_sessions.sh"
  - "scripts/tests/test_quality_evolution_compact.sh"
  - "scripts/tests/test_route_learning_compact.sh"
  - "scripts/tests/test_mvp_team_closure.sh"
  - "scripts/check_interface_bindings.sh"
  - "scripts/runtime_health_audit.sh --slot-time 050000 --notify false"
  - "scripts/sync_runtime_backlog_tasks.sh --runtime-report /Volumes/TB512/3_ClawDocs/team-brain-trust/ops/$(date +%Y%m)/runtime_health_report-$(date +%Y%m%d)-050000.json --docs-root /Volumes/TB512/3_ClawDocs --team team-brain-trust --yyyymm $(date +%Y%m)"
  - "scripts/audit_task_ledger_sla.sh --docs-root /Volumes/TB512/3_ClawDocs --teams team-brain-trust,team-knowledge,team-rd,team-smart3d,team-proposal --yyyymm $(date +%Y%m) --stale-hours 24"
  - "scripts/bootstrap_agent_sessions.sh --docs-root /Volumes/TB512/3_ClawDocs --team team-brain-trust --strict false"
  - "scripts/quality_evolution_compact.sh --docs-root /Volumes/TB512/3_ClawDocs --team team-brain-trust --teams team-knowledge,team-rd,team-smart3d,team-proposal --window-days 30 --slot-time 050000"
  - "scripts/route_learning_compact.sh --memory-dir ~/.openclaw/workspace/memory --window 200 --report-json /Volumes/TB512/3_ClawDocs/team-brain-trust/ops/$(date +%Y%m)/route_learning_report-$(date +%Y%m%d)-050000.json --report-md /Volumes/TB512/3_ClawDocs/team-brain-trust/ops/$(date +%Y%m)/route_learning_report-$(date +%Y%m%d)-050000.md"
  - "scripts/run_mvp_team_closure.sh --docs-root /Volumes/TB512/3_ClawDocs --teams team-knowledge,team-rd,team-smart3d --tasks-per-team 1 --yyyymm $(date +%Y%m)"
  - "scripts/run_mvp_team_closure.sh --docs-root /Volumes/TB512/3_ClawDocs --teams team-proposal --tasks-per-team 1 --yyyymm $(date +%Y%m)"
  - "rg -n \"质量自把关|QSGP|质量持续提升|QEL\" 00_Brain_Trust_Charter.md"
  - "rg -n \"学习治理与通知闭环|scholar|feige_notifier|project_score\" 00_Brain_Trust_Charter.md"
  - "rg -n \"Stage 5：质量门禁与改进回写|quality_gate_report|quality_improvement_log\" 01_Review_Workflow.md"
  - "rg -n \"Scholar 学习场景|notification_receipt|1 课题/日|日上限 20 来源\" 01_Review_Workflow.md"
  - "rg -n \"quality_gate_report|quality_improvement_log|QSGP|QEL\" 00_START_REVIEW_HERE.md"
  - "rg -n \"scholar|feige_notifier|project_score|QMD\" 00_START_REVIEW_HERE.md"
  - "rg -n \"Scholar Learning Contract|scholar|feige_notifier|project_score\" DEPLOYMENT_RELEASE.md"
  - "scripts/run_brain_trust_review.sh --proposal 02_Proposal_Submission_Template.md --depth quick --out /Volumes/TB512/3_ClawDocs/team-brain-trust/review/202603 --local"
  - "test -f /Volumes/TB512/3_ClawDocs/team-brain-trust/ops/$(date +%Y%m)/runtime_health_report-$(date +%Y%m%d)-050000.json"
  - "rg -n \"stage4_status|execution_summary|acceptance_report\" /Volumes/TB512/3_ClawDocs/team-brain-trust/review/202603/structured_summary.json /Volumes/TB512/3_ClawDocs/team-brain-trust/review/202603/acceptance_report.json"
  - "test -f /Volumes/TB512/3_ClawDocs/team-brain-trust/review/202603/pangu_execution_plan.md && test -f /Volumes/TB512/3_ClawDocs/team-brain-trust/review/202603/pangu_execution_report.md && test -f /Volumes/TB512/3_ClawDocs/team-brain-trust/review/202603/pangu_execution_raw.json && test -f /Volumes/TB512/3_ClawDocs/team-brain-trust/review/202603/acceptance_report.json && test -f /Volumes/TB512/3_ClawDocs/team-brain-trust/review/202603/quality_gate_report.json && test -f /Volumes/TB512/3_ClawDocs/team-brain-trust/review/202603/quality_improvement_log.jsonl && test -f /Volumes/TB512/3_ClawDocs/team-brain-trust/review/202603/quality_baseline.yaml"
notes:
  - "Stage1 runs serially due to OpenClaw global default model config semantics."
  - "Four-provider coverage is required in each role chain: OpenAI, Google, ZAI, Bailian."
  - "Stage4 is enabled by default and executed by pangu with degraded-continue failure policy."
  - "Main runs in mixed router mode: direct light execution + auto delegation + routing memory learning."
  - "Execution-heavy tasks use queue scheduling (single queue, max inflight=2, backlog auto scale)."
  - "Design-level quality contracts are mandatory: QSGP (self-gate) + QEL (continuous measurable improvement)."
  - "Business artifacts must be written under /Volumes/TB512/3_ClawDocs/<team>/<artifact>/<yyyymm>/ with max depth 3."
