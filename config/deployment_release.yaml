release_version: "v1.4.2"
openclaw_compatibility: "2026.3.2"
openai_policy:
  type: "fixed"
  allowed_model: "openai-codex/gpt-5.3-codex"
runtime_topology:
  entry_agent: "main_mixed_router"
  architecture_agent: "luban"
  execution_agent: "pangu_queue_scheduler"
  scheduler_model: "scheduler-* independent dispatch"
permission_policy:
  global_tools_profile: "messaging"
  main_tools_profile: "full"
  pangu_tools_profile: "full"
  approval_mode: "ask"
  minimal_allowlist:
    - "/opt/homebrew/bin/openclaw"
    - "/usr/bin/git"
    - "/usr/bin/python3"
    - "/usr/bin/pip3"
    - "/opt/homebrew/bin/clawhub"
main_enhancement_policy:
  pangu_direct_write: "enabled_with_whitelist_and_audit"
  whitelist_paths:
    - "~/.openclaw/workspace/memory/**"
    - "~/.openclaw/workspace/skills/**"
    - "~/.openclaw/workspace/AGENTS.md#routing-rules"
  forbidden_paths:
    - "~/.openclaw/openclaw.json"
    - "~/.openclaw/exec-approvals.json"
memory_model:
  topology: "layered"
  main_shared:
    - "~/.openclaw/workspace/memory/ROUTING_MEMORY.md"
    - "~/.openclaw/workspace/memory/ROUTING_DECISIONS.jsonl"
    - "~/.openclaw/workspace/memory/PROMOTION_LOG.jsonl"
  pangu_private:
    - "~/.openclaw/workspaces/pangu/memory/EXECUTION_LEARNINGS.md"
    - "~/.openclaw/workspaces/pangu/memory/MAIN_PATCH_LOG.jsonl"
required_artifacts:
  team_design_outputs:
    - "team_blueprint.md"
    - "team_agent_contract.json"
    - "team_model_assignment.json"
  quality_contract_outputs:
    - "quality_gate_report.json"
    - "quality_improvement_log.jsonl"
    - "quality_baseline.yaml"
  team_contract_constraints:
    - "interface_agent_id must be unique team external entry"
    - "internal agents cannot reply to end user directly"
    - "team model assignment must include selection_rationale per agent"
  quality_contract_constraints:
    - "any failed quality gate must force final_quality_status=blocked"
    - "quality improvement loop must include measurable metric changes"
required_scripts:
  - "scripts/validate_brain_trust_env.sh"
  - "scripts/bootstrap_luban_role.sh"
  - "scripts/validate_team_contract.sh"
  - "scripts/sync_brain_trust_models.sh"
  - "scripts/export_available_models.sh"
  - "scripts/run_brain_trust_review.sh"
  - "scripts/test_run_brain_trust_review_regression.sh"
  - "scripts/bootstrap_brain_trust.sh"
  - "scripts/bootstrap_agent_memory_layers.sh"
  - "scripts/route_learning_compact.sh"
  - "scripts/promote_skill_from_pangu_to_main.sh"
  - "scripts/verify_main_delegate_reliability.sh"
  - "scripts/pangu_task_scheduler.sh"
  - "scripts/ensure_scheduler_capacity.sh"
  - "scripts/verify_public_release.sh"
  - "scripts/build_release_branch.sh"
  - "scripts/check_release_docs_consistency.sh"
acceptance_checks:
  - "bash -n scripts/run_brain_trust_review.sh"
  - "bash -n scripts/validate_brain_trust_env.sh"
  - "bash -n scripts/bootstrap_luban_role.sh"
  - "bash -n scripts/validate_team_contract.sh"
  - "bash -n scripts/sync_brain_trust_models.sh"
  - "bash -n scripts/test_run_brain_trust_review_regression.sh"
  - "bash -n scripts/bootstrap_brain_trust.sh"
  - "bash -n scripts/bootstrap_agent_memory_layers.sh"
  - "bash -n scripts/route_learning_compact.sh"
  - "bash -n scripts/promote_skill_from_pangu_to_main.sh"
  - "bash -n scripts/verify_main_delegate_reliability.sh"
  - "bash -n scripts/pangu_task_scheduler.sh"
  - "bash -n scripts/ensure_scheduler_capacity.sh"
  - "bash -n scripts/verify_public_release.sh"
  - "bash -n scripts/build_release_branch.sh"
  - "bash -n scripts/check_release_docs_consistency.sh"
  - "scripts/verify_main_delegate_reliability.sh"
  - "scripts/build_release_branch.sh --version v1.4.2 --dry-run --allow-dirty"
  - "scripts/check_release_docs_consistency.sh"
  - "scripts/pangu_task_scheduler.sh stats --queue-file /tmp/bt_queue.jsonl --state-file /tmp/bt_queue_state.json"
  - "scripts/ensure_scheduler_capacity.sh --queue-depth 1 --threshold 6 --registry-file /tmp/bt_scheduler_registry.json --events-file /tmp/bt_scheduler_events.jsonl"
  - "source config/brain_trust.env.example && scripts/validate_brain_trust_env.sh"
  - "scripts/validate_team_contract.sh --dir roles/luban/templates"
  - "scripts/test_run_brain_trust_review_regression.sh"
  - "rg -n \"质量自把关|QSGP|质量持续提升|QEL\" 00_Brain_Trust_Charter.md"
  - "rg -n \"Stage 5：质量门禁与改进回写|quality_gate_report|quality_improvement_log\" 01_Review_Workflow.md"
  - "rg -n \"quality_gate_report|quality_improvement_log|QSGP|QEL\" 00_START_REVIEW_HERE.md"
  - "scripts/run_brain_trust_review.sh --proposal 02_Proposal_Submission_Template.md --depth quick --out /tmp/brain_trust_e2e --local"
  - "rg -n \"stage4_status|execution_summary\" /tmp/brain_trust_e2e/structured_summary.json"
  - "test -f /tmp/brain_trust_e2e/pangu_execution_plan.md && test -f /tmp/brain_trust_e2e/pangu_execution_report.md && test -f /tmp/brain_trust_e2e/pangu_execution_raw.json"
notes:
  - "Stage1 runs serially due to OpenClaw global default model config semantics."
  - "Four-provider coverage is required in each role chain: OpenAI, Google, ZAI, Bailian."
  - "Stage4 is enabled by default and executed by pangu with degraded-continue failure policy."
  - "Main runs in mixed router mode: direct light execution + auto delegation + routing memory learning."
  - "Execution-heavy tasks use queue scheduling (single queue, max inflight=2, backlog auto scale)."
  - "Design-level quality contracts are mandatory: QSGP (self-gate) + QEL (continuous measurable improvement)."
