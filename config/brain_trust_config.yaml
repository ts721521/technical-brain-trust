# Technical Brain Trust - Deployment Config v1.3
# 模型ID使用环境变量提供：BT_*

framework_version: "1.3"

# 三角色模型配置（必须使用不同主模型）
roles:
  architect:
    model_env: "BT_ARCHITECT_MODEL"
    fallback_envs:
      - "BT_ARCHITECT_FALLBACK_1"
      - "BT_ARCHITECT_FALLBACK_2"
      - "BT_ARCHITECT_FALLBACK_3"
    description: "架构师 - 系统设计视角"

  critic:
    model_env: "BT_CRITIC_MODEL"
    fallback_envs:
      - "BT_CRITIC_FALLBACK_1"
      - "BT_CRITIC_FALLBACK_2"
      - "BT_CRITIC_FALLBACK_3"
    description: "批判者 - 魔鬼代言人视角"

  innovator:
    model_env: "BT_INNOVATOR_MODEL"
    fallback_envs:
      - "BT_INNOVATOR_FALLBACK_1"
      - "BT_INNOVATOR_FALLBACK_2"
      - "BT_INNOVATOR_FALLBACK_3"
    description: "创新者 - 发散思维视角"

# 审查参数
review:
  default_depth: "standard"              # quick / standard / deep
  required_methods_min: 2                # 每角色最少使用方法论数
  consensus_threshold: 0.67              # 达成共识所需比例 (2/3)
  consensus_score_diff: 2                # 评分差 <= 此值视为共识
  auto_second_round: false               # 优化后是否自动再审
  report_format: "structured"           # structured / narrative

# 评分权重（可按项目调整，公式固定）
# final_score = sum(weight_i * normalized_score_i)
# risk_normalized = 11 - raw_risk_score
scoring_weights:
  feasibility: 0.25
  robustness: 0.20
  scalability: 0.15
  simplicity: 0.15
  innovation: 0.10
  risk: 0.15            # 反向归一化后使用

# 运行时约束
runtime:
  max_tokens_per_role: 16000             # 每角色 token 预算（提示项，当前不做硬截断）
  max_proposal_chars: 24000              # 方案内容最大字符数（超限截断并留痕）
  timeout_per_role_seconds: 120          # 每角色超时（秒）
  retry:
    max_attempts: 4                      # 最大重试次数（主模型 + 3级fallback）
    backoff_seconds: 5                   # 重试间隔
  degradation:
    strategy: "continue_partial"         # continue_partial / abort / fallback_model
    min_roles_required: 2                # 最少需要多少角色完成审查（不足则标记降级）
    fallback_depth: "quick"              # 降级时切换到的审查深度
  execution:
    enabled: true
    executor_agent: "pangu"
    timeout_seconds: 240
    max_attempts: 2
    backoff_seconds: 5
    on_failure: "degraded_continue"      # degraded_continue / fail
  scheduler:
    enabled: true
    scope: "execution_heavy_only"
    max_inflight: 2
    queue_max: 50
    backlog_scale_threshold: 6
    dispatch_timeout_seconds: 180
    retry:
      max_attempts: 2
      backoff_seconds: 5
  audit:
    enabled: true
    daily_time: "05:00"
    timezone: "Asia/Shanghai"
    teams:
      - "team-brain-trust"
      - "team-knowledge"
      - "team-rd"
    outputs:
      - "runtime_health_report-YYYYMMDD-050000.json"
      - "agent_model_inventory-YYYYMMDD-050000.md"
      - "team_topology-YYYYMMDD-050000.md"
      - "improvement_backlog-YYYYMMDD-050000.md"

# 输出存储
output:
  docs_root: "/Volumes/TB512/3_ClawDocs" # 业务产物根目录（可被 BT_DOCS_ROOT 覆盖）
  team_id: "team-brain-trust"            # 默认团队标识
  path_policy:
    max_depth_after_root: 3              # docs_root 后最多三级：team/artifact/yyyymm
    enforce_file_in_leaf_dir: true       # 文件必须落在第3层目录
    team_name_pattern: "^team-[a-z0-9]+(-[a-z0-9]+)*$"
    artifact_allowlist:
      - "review"
      - "execution"
      - "deploy"
      - "release"
      - "evidence"
      - "ops"
      - "custom-<kebab>"
    file_name_pattern: "^[a-z0-9]+(-[a-z0-9]+)*-[0-9]{8}-[0-9]{6}\\.[a-z0-9]+$"
  index_file_policy:
    enabled: true
    relative_path: "ops/<yyyymm>/artifact_index.jsonl"
  base_path: "reviews/"                  # deprecated: 仅历史兼容，不作为默认输出路径
  structure: "reviews/<timestamp>/"      # deprecated: 仅历史兼容
  files:
    - "architect_review.md"
    - "critic_review.md"
    - "innovator_review.md"
    - "architect_cross_review.md"
    - "critic_cross_review.md"
    - "innovator_cross_review.md"
    - "editor_review.md"
    - "pangu_execution_plan.md"
    - "pangu_execution_report.md"
    - "pangu_execution_raw.json"
    - "pangu_execution_raw.json.stderr"
    - "summary_report.md"                # 合成报告
    - "structured_summary.json"          # 结构化摘要（机读）
    - "acceptance_report.json"           # 验收结果（braintrust_compliance）
    - "quality_gate_report.json"         # 质量门禁结果（QSGP）

# 开源方案推荐标准
opensource_recommendation:
  min_stars: 100                         # 推荐的 GitHub 项目最少 star 数
  require_active_maintenance: true       # 最近 6 个月有 commit
  max_open_critical_issues: 5            # 严重 issue 不超过此数
